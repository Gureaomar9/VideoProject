<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Song Showcase</title>
    <style>
        /* CSS Customization: Background gradient, fonts, and layout */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f4068, #162447);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            max-width: 700px;
            width: 90%;
        }

        /* JavaScript Animation Target */
        h1 {
            color: #e43f5a;
            margin-bottom: 10px;
            transition: transform 0.3s ease;
        }

        p {
            color: #b0c4de;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

            .video-wrapper iframe {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border: none;
            }

        button {
            margin-top: 25px;
            background-color: #e43f5a;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

            button:hover {
                background-color: #ff4757;
                transform: scale(1.05);
            }
    </style>
</head>
<body>

    <div class="container">
        <!-- HTML & Animated Header -->
        <h1 id="mainTitle">🎵 Featured Track Showcase 🎵</h1>
        <p>Enjoying one of my favorite songs right here on the web.</p>

        <!-- Embedded YouTube Music Video -->
        <div class="video-wrapper">
            <!-- Replace the src URL with your favorite song's YouTube embed link -->
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ"
                    title="YouTube video player"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
            </iframe>
        </div>

        <button onclick="triggerSpecialEffect()">Click for Animation Effect!</button>
    </div>

    <script>
        // JavaScript Animation 1: Page-load pulse effect on the header
        window.addEventListener('DOMContentLoaded', () => {
            const title = document.getElementById('mainTitle');
            let scaleDirection = 1;

            // Simple keyframe-like js animation interval
            setInterval(() => {
                title.style.transform = scaleDirection > 0 ? 'scale(1.05)' : 'scale(1.0)';
                scaleDirection *= -1;
            }, 1500);
        });

        // JavaScript Animation 2: Interactive button click spin/shake effect
        function triggerSpecialEffect() {
            const container = document.querySelector('.container');
            let pos = 0;
            let id = setInterval(frame, 5);

            function frame() {
                if (pos == 20) {
                    clearInterval(id);
                    container.style.transform = 'translateX(0px)';
                } else {
                    pos++;
                    // Quick shake effect
                    container.style.transform = `translateX(${Math.sin(pos) * 10}px)`;
                }
            }
        }
    </script>

</body>
</html>
